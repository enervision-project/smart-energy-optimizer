# EnerVision — stack Docker Compose du projet.
name: enervision

services:
  web:
    # front Angular servi par nginx (contexte app/web : son .dockerignore s'applique)
    build:
      context: app/web
    ports:
      - "127.0.0.1:4200:80"

  etl-worker:
    build:
      context: .
      dockerfile: services/etl-worker/Dockerfile
    env_file: .env
    # rend host.docker.internal disponible sous Linux (API lancée sur l'hôte)
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db:
        condition: service_healthy

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    environment:
      # hôte « db » = nom du service ; reprend les valeurs POSTGRES_* du .env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    # PostgreSQL 16 + extension TimescaleDB
    image: docker.io/timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # exécuté au premier démarrage uniquement (volume vide)
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata: {}
