# EnerVision — stack Docker Compose du projet.
name: enervision

x-etl: &etl
  image: enervision-etl-worker:local
  build:
    context: .
    dockerfile: services/etl-worker/Dockerfile
  env_file: .env
  # API lancée sur l'hôte : disponible aussi sous Linux.
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    db:
      condition: service_healthy

services:
  # Commandes ponctuelles : docker compose run --rm etl-worker ...
  etl-worker:
    <<: *etl
    profiles: ["manual"]

  # Planification dans Docker, identique en développement et sur EC2.
  scheduler:
    <<: *etl
    command: ["/usr/local/bin/etl-cron-start"]
    restart: unless-stopped

  db:
    restart: unless-stopped
    # PostgreSQL 16 + extension TimescaleDB
    image: docker.io/timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Exécuté au premier démarrage uniquement (volume vide).
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata: {}
