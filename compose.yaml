x-etl: &etl
  image: enervision-etl-worker:local
  build:
    context: .
    dockerfile: services/etl-worker/Dockerfile
  env_file: .env
  # API lancée sur l'hôte : disponible aussi sous Linux.
  extra_hosts: [ "host.docker.internal:host-gateway" ]
  depends_on:
    migrate:
      condition: service_completed_successfully

x-mlflow: &mlflow
  image: enervision-mlflow:local
  build:
    context: services/ml-service/mlflow
  profiles: [ "ml" ]
  environment: &mlflow-env
    MLFLOW_DB_HOST: db
    MLFLOW_DB_PORT: "5432"
    MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
    MLFLOW_DB_USER: ${MLFLOW_DB_USER:-mlflow}
    MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow-local}
# EnerVision — stack Docker Compose du projet.
name: enervision

services:
  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # hôte « db » = nom du service ; reprend les valeurs POSTGRES_* du .env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # secret obligatoire : compose refuse de démarrer si JWT_SECRET est absent du .env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      # premier compte ADMIN, créé au démarrage tant que la table users est vide (facultatif)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"

  db:
    image: docker.io/timescale/timescaledb:2.30.2-pg16
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  etl-worker:
    <<: *etl
    profiles: [ "manual" ]

  migrate:
    image: docker.io/liquibase/liquibase:4.33.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infra/db/changelog:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}
      # changelog parameter: password of the monitoring role (007_monitoring_role.sql)
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-monitoring-local}
    command: [ "--search-path=/liquibase/changelog", "--changelog-file=changelog.yaml", "update" ]

  mlflow:
    depends_on:
      mlflow-init:
        condition: service_completed_successfully
    volumes:
      - mlflow_artifacts:/mlartifacts
    environment:
      <<: *mlflow-env
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      MLFLOW_SQLALCHEMYSTORE_POOL_SIZE: "2"
      MLFLOW_SQLALCHEMYSTORE_MAX_OVERFLOW: "2"
      # sans ça, MLflow 3.17 lance 7 workers de jobs (~1,6 Go) : OOM sur l'EC2
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=5).read()" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    <<: *mlflow

  mlflow-init:
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *mlflow-env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: [ "python", "init_db.py" ]
    <<: *mlflow

  prediction-jobs:
    image: enervision-prediction-service:local
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    volumes:
      - ml_models:/models
      - ./.data/ml/splits:/bootstrap:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL doit être défini dans .env}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REGISTERED_MODEL_NAME: ${REGISTERED_MODEL_NAME:-enervision-hourly-consumption}
      TRAINING_BOOTSTRAP_URI: ${TRAINING_BOOTSTRAP_URI:-/bootstrap}
      TRAINING_TIMEZONE: ${TRAINING_TIMEZONE:-Europe/Paris}
      VALIDATION_DAYS: ${VALIDATION_DAYS:-14}
      MIN_CURRENT_VALIDATION_HOURS: ${MIN_CURRENT_VALIDATION_HOURS:-168}
      # Recalage de niveau des prévisions ; false = prévision brute du champion publiée.
      LEVEL_RECALIBRATION: ${LEVEL_RECALIBRATION:-true}
    command: [ "python", "-m", "prediction_service.jobs" ]
    restart: unless-stopped
    profiles: [ "ml" ]

  prediction-service:
    image: enervision-prediction-service:local
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    volumes:
      - ml_models:/models
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REGISTERED_MODEL_NAME: ${REGISTERED_MODEL_NAME:-enervision-hourly-consumption}
    ports:
      - "127.0.0.1:${PREDICTION_SERVICE_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).read()" ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  scheduler:
    command: [ "/usr/local/bin/etl-cron-start" ]
    restart: unless-stopped
    <<: *etl
  web:
    build:
      context: app/web
    ports:
      - "127.0.0.1:4200:80"

volumes:
  dbdata: {}
  mlflow_artifacts: {}
  ml_models: {}
