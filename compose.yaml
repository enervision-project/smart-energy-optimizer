# EnerVision — stack Docker Compose du projet.
name: enervision

x-etl: &etl
  image: enervision-etl-worker:local
  build:
    context: .
    dockerfile: services/etl-worker/Dockerfile
  env_file: .env
  # API lancée sur l'hôte : disponible aussi sous Linux.
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  web:
    # front Angular servi par nginx (contexte app/web : son .dockerignore s'applique)
    build:
      context: app/web
    ports:
      - "127.0.0.1:4200:80"

  etl-worker:
    <<: *etl
    profiles: ["manual"]

  scheduler:
    <<: *etl
    command: ["/usr/local/bin/etl-cron-start"]
    restart: unless-stopped

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    environment:
      # hôte « db » = nom du service ; reprend les valeurs POSTGRES_* du .env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # secret obligatoire : compose refuse de démarrer si JWT_SECRET est absent du .env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    # Applique les changesets Liquibase manquants (infra/db/changelog) puis s'arrête.
    # Relancé à chaque « up » : sans nouveau changeset, il ne fait rien.
    image: docker.io/liquibase/liquibase:4.33.0
    command: ["--search-path=/liquibase/changelog", "--changelog-file=changelog.yaml", "update"]
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/db/changelog:/liquibase/changelog:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    restart: unless-stopped
    # PostgreSQL 16 + extension TimescaleDB
    image: docker.io/timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata: {}
