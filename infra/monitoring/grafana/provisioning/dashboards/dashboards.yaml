# Loaded at Grafana startup; UI edits are not saved: export the JSON and commit it.
# Edits made in the UI are not saved to git: export the JSON and commit it.
apiVersion: 1

providers:
  - name: enervision
    folder: EnerVision
    type: file
    disableDeletion: true
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
