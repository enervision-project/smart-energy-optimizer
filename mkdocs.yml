site_name: Smart Energy Optimizer
site_url: https://github.com/enervision-project/smart-energy-optimizer
site_description: Documentation de Smart Energy Optimizer
copyright: Copyright &copy; 2026 EnerVision
repo_name: Smart Energy Optimizer
repo_url: https://github.com/enervision-project/smart-energy-optimizer
theme:
  name: material
  language: fr
  logo: assets/logo-short.png
  favicon: assets/logo.ico
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.instant
  palette:
    # Light mode
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre
    # Dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair
plugins:
  - search
  - monorepo
  - awesome-pages

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/external-links.js

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/enervision-project
nav:
  - Accueil: index.md
  - ...
  - Sauvegardes et intégrité: doc-technique/transverse/infra/sauvegardes.md
  - ETL Worker: '!include ./services/etl-worker/mkdocs.yml'
  - ML Service: '!include ./services/ml-service/mkdocs.yml'
  - Prediction Service: '!include ./services/prediction-service/mkdocs.yml'
  - Core API: '!include ./services/core-api/mkdocs.yml'
  - UI: '!include ./app/web/mkdocs.yml'
