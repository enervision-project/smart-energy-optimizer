[project]
name = "enervision-etl-worker"
version = "0.1.0"
description = "ETL EnerVision planifié par cron"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
etl-worker = "etl_worker.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_worker"]
