[project]
name = "enervision-etl-worker"
version = "0.1.0"
description = "ETL EnerVision planifié par cron"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8",
]

[project.scripts]
etl-worker = "etl_worker.__main__:main"
etl-extract-alerts = "etl_worker.extract:alerts_main"
etl-sync-alerts = "etl_worker.load:alerts_main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_worker"]
