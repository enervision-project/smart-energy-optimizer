sonar.projectKey=enervision-project_smart-energy-optimizer_etl_worker
sonar.organization=enervision-project


#sonar.projectName=ETL Worker

sonar.sources=src
sonar.tests=tests


sonar.test.inclusions=tests/**/*.py,**/test_*.py,**/*_test.py
sonar.exclusions=**/migrations/**,\
  **/__pycache__/**,\
  **/.venv/**,

sonar.coverage.exclusions=tests/**,\
  **/__init__.py,\
  **/conftest.py,\
  **/__pycache__/**,\
  **/.venv/**,


sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
