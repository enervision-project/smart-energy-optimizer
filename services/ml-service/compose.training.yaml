# From the root: docker compose -f compose.yaml -f services/ml-service/compose.training.yaml ...
services:
  ml-prepare:
    image: enervision-ml-trainer:local
    build:
      context: services/ml-service
      dockerfile: Dockerfile.training
    volumes:
      - type: bind
        source: ./.data/ml/raw/all_sites_combined.csv
        target: /raw/all_sites_combined.csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.data/ml/raw/metadata
        target: /raw/metadata
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.data/ml/splits
        target: /output
        bind:
          create_host_path: false
    command:
      - --source
      - /raw/all_sites_combined.csv
      - --metadata-dir
      - /raw/metadata
      - --output-dir
      - /output
    entrypoint: [ "python", "-m", "training.prepare_data" ]
    cpus: 2.0
    mem_limit: 2g
    profiles: [ "preparation" ]
  ml-trainer:
    image: enervision-ml-trainer:local
    build:
      context: services/ml-service
      dockerfile: Dockerfile.training
    volumes:
      - type: bind
        source: ./.data/ml/splits/train.parquet
        target: /data/train.parquet
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.data/ml/splits/validation.parquet
        target: /data/validation.parquet
        read_only: true
        bind:
          create_host_path: false
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRAINING_DATA_DIR: /data
      TRAINING_GIT_REVISION: ${TRAINING_GIT_REVISION:-unknown}
      TRAINING_GIT_DIRTY: ${TRAINING_GIT_DIRTY:-unknown}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    cpus: 2.0
    mem_limit: 2g
    profiles: [ "training" ]
