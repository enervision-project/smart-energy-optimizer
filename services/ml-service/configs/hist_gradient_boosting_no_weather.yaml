model: hist_gradient_boosting
experiment: consommation-horaire-sans-meteo-v1
run_name: HistGradientBoosting_no_weather
features:
  - site_id
  - hour
  - day_of_week
  - month
  - is_working_hours
  - lag_24h
  - lag_168h
parameters:
  loss: absolute_error
  learning_rate: 0.1
  max_leaf_nodes: 63
  min_samples_leaf: 50
  max_iter: 300
  early_stopping: false
  l2_regularization: 0.0
  max_bins: 255
  random_state: 42
