base_config: hgb_without_lags.yaml
include_ablations: false
run_name_prefix: HGB_without_both_lags_grid
grid:
  max_leaf_nodes: [31, 63]
  min_samples_leaf: [20, 50, 100]
  l2_regularization: [0.0, 10.0]
  learning_schedule:
    - learning_rate: 0.1
      max_iter: 300
    - learning_rate: 0.05
      max_iter: 600
