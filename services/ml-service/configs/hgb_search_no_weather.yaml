base_config: hist_gradient_boosting_no_weather.yaml
include_ablations: false
run_name_prefix: HGB_no_weather
feature_variants:
  both_lags: [site_id, hour, day_of_week, month, is_working_hours, lag_24h, lag_168h]
  lag_24h: [site_id, hour, day_of_week, month, is_working_hours, lag_24h]
  lag_168h: [site_id, hour, day_of_week, month, is_working_hours, lag_168h]
  no_lags: [site_id, hour, day_of_week, month, is_working_hours]
grid:
  max_leaf_nodes: [31, 63]
  min_samples_leaf: [20, 50, 100]
  l2_regularization: [0.0, 10.0]
  learning_schedule:
    - learning_rate: 0.1
      max_iter: 300
    - learning_rate: 0.05
      max_iter: 600
