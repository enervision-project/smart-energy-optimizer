model: hist_gradient_boosting
experiment: consommation-horaire-production
run_name: HistGradientBoosting_production
features:
  - site_id
  - hour
  - day_of_week
  - month
  - is_working_hours
parameters:
  loss: absolute_error
  learning_rate: 0.1
  max_leaf_nodes: 31
  min_samples_leaf: 50
  max_iter: 300
  early_stopping: false
  l2_regularization: 0.0
  max_bins: 255
  random_state: 42
