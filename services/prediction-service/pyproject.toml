[project]
name = "enervision-prediction-service"
version = "0.1.0"
description = "API de prédiction EnerVision (modèle XGBoost ou scikit-learn)"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pydantic-settings>=2.6,<3",
    # version figée : celle de l'entraînement (requirements-training.txt), le pickle en dépend
    "scikit-learn==1.9.1",
    "uvicorn>=0.32,<1",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8",
]

[project.scripts]
prediction-service = "prediction_service.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F : pyflakes + pycodestyle ; I : imports ; B : bugbear ; UP : syntaxe moderne ; S : sécurité
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
