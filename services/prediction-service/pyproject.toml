[project]
name = "enervision-prediction-service"
version = "0.1.0"
description = "API de prédiction EnerVision (modèle XGBoost ou scikit-learn)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "mlflow==3.17.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "psycopg[binary]>=3.2,<4",
    "pyarrow==25.0.1",
    "pydantic-settings>=2.6,<3",
    "PyYAML==6.0.3",
    # pinned to the training version (requirements-training.txt): the pickle depends on it
    "scikit-learn==1.9.1",
    "uvicorn>=0.32,<1",
    # Same `xgboost` module without the GPU libraries (~600 MB): the EC2 has no GPU.
    "xgboost-cpu>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8",
]

[project.scripts]
prediction-service = "prediction_service.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../ml-service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle; I: imports; B: bugbear; UP: modern syntax; S: security
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
