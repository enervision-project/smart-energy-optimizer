spring:
  application:
    name: core-api

  # Local run: read the root .env (gitignored). Optional: compose.yaml passes the variables in a container.
  # Optional: in a container there is no .env, compose.yaml passes the variables instead.
  config:
    import: optional:file:../../.env[.properties]

  # Explicit placeholders: .env keys are not relaxed-bound. Empty defaults on purpose: the app refuses to start.
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # The schema is managed by Liquibase (infra/db/changelog): Hibernate only validates the entities.
  jpa:
    hibernate:
      ddl-auto: validate

  # Standard HTTP errors (validation, 404, 405…) as ProblemDetail (RFC 9457)
  mvc:
    problemdetails:
      enabled: true

enervision:
  security:
    jwt:
      # Base64 HMAC-SHA256 key, at least 32 bytes. Empty default on purpose: required at startup.
      # Secret: empty default on purpose, the app refuses to start (@NotBlank) without JWT_SECRET.
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: enervision-core-api
    # First ADMIN, created while the users table is empty. Empty email: none.
    # Empty email: no account is created.
    initial-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
