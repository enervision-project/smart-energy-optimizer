# Surcharge production (EC2), appliquée par infra/deploy/deploy.sh :
#   docker compose -f compose.yaml -f compose.prod.yaml ...
# Les images viennent d'ECR (construites par la CI) au lieu d'être construites sur place.
# ECR_REGISTRY et <SERVICE>_TAG sont écrits dans deploy.env par le script de déploiement.

# Meme image pour les migrations et le serveur. Le profil "ml" est conserve : MLflow ne demarre
# pas avec un `up` sans argument, seul deploy.sh le demarre quand il est deploye explicitement.
x-mlflow-prod: &mlflow-prod
  build: !reset "null"
  image: ${ECR_REGISTRY}/enervision/mlflow:${MLFLOW_TAG:-latest}
  environment: &mlflow-prod-env
    MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:?MLFLOW_DB_NAME doit etre fourni par SSM}
    MLFLOW_DB_USER: ${MLFLOW_DB_USER:?MLFLOW_DB_USER doit etre fourni par SSM}
    MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD doit etre fourni par SSM}

services:
  core-api:
    image: ${ECR_REGISTRY}/enervision/core-api:${CORE_API_TAG:-latest}
    build: !reset "null"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      # pas de documentation OpenAPI / Swagger UI en production
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    # joignable uniquement via proxy (/api/*)
    ports: !reset []
    restart: unless-stopped
    # EC2 de 2 Go partagée : JVM limitée à 75 % du conteneur
    mem_limit: 512m

  db:
    ports: !reset []
    restart: unless-stopped

  etl-worker:
    image: ${ECR_REGISTRY}/enervision/etl-worker:${ETL_WORKER_TAG:-latest}
    build: !reset "null"
    restart: unless-stopped

  migrate:
    environment:
      # no local default in production
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:?MONITORING_DB_PASSWORD must come from SSM}

  mlflow:
    volumes: !reset []
    environment:
      <<: *mlflow-prod-env
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION doit etre fourni par SSM}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION:?MLFLOW_ARTIFACTS_DESTINATION doit etre fourni par SSM}
    <<: *mlflow-prod

  mlflow-init:
    <<: *mlflow-prod

  prediction-jobs:
    image: ${ECR_REGISTRY}/enervision/prediction-service:${PREDICTION_SERVICE_TAG:-latest}
    build: !reset "null"
    volumes: !override
      - ml_models:/models
    environment:
      TRAINING_BOOTSTRAP_URI: ${TRAINING_BOOTSTRAP_URI:?TRAINING_BOOTSTRAP_URI doit etre fourni par SSM}
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g

  prediction-service:
    image: ${ECR_REGISTRY}/enervision/prediction-service:${PREDICTION_SERVICE_TAG:-latest}
    build: !reset "null"
    environment:
      ENABLE_DOCS: "false"
    restart: unless-stopped
    # jamais derrière Caddy : seul l'hôte (tunnel SSM) et les autres conteneurs y accèdent
    mem_limit: 512m
  proxy:
    image: docker.io/library/caddy:2.11-alpine
    depends_on: [ web ]
    volumes:
      # directory mount: a Caddyfile replaced by the deploy stays visible to the container
      - ./infra/proxy:/etc/caddy:ro
      - caddydata:/data # certificats
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp" # HTTP/3
    restart: unless-stopped

  scheduler:
    image: ${ECR_REGISTRY}/enervision/etl-worker:${ETL_WORKER_TAG:-latest}
    build: !reset "null"
    restart: unless-stopped

  web:
    image: ${ECR_REGISTRY}/enervision/web:${WEB_TAG:-latest}
    build: !reset "null"
    # joignable uniquement via proxy
    ports: !reset []
    restart: unless-stopped

volumes:
  caddydata: {}
