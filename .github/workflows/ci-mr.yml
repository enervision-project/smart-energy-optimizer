name: MR Verification

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Détection des modifications
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'app/**'

  call-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/_mr-frontend.yml
    secrets:
      SONAR_TOKEN_FRONTEND: ${{ secrets.SONAR_TOKEN_FRONTEND }}

  # Single check to require in the main ruleset: call-frontend / build only
  # exists when app/ changed.
  mr-ok:
    needs: [changes, call-frontend]
    # always(): also report a result when a needed job failed or was skipped
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # skipped = app/ unchanged; failure or cancelled blocks the merge
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"