# Construit et déploie uniquement les services modifiés (liste dans .github/services.json).
# Les PR ne passent pas par ce workflow : ci.yml (_ci-images.yml) y construit les images sans les publier.
# - push sur main : construit, publie dans ECR, puis redéploie ces services sur l'EC2 (SSM)
#   après validation manuelle (environment GitHub « production », reviewers obligatoires).
#   Les changements sont calculés depuis le dernier commit déployé avec succès
#   (paramètre SSM /enervision/prod/deployed-sha) : un run annulé ou en échec
#   est donc rattrapé par le suivant.
# - lancement manuel : déploie les services choisis (« all » par défaut).
# Variables du dépôt requises (outputs Terraform) : AWS_DEPLOY_ROLE_ARN, DEPLOY_BUCKET.
# Secrets du dépôt requis : ENERGY_API_USERNAME, ENERGY_API_PASSWORD (recopiés dans SSM à chaque déploiement).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Services à déployer : all, ou noms séparés par des virgules (ex. web,db)"
        default: all

# aucun droit par défaut, chaque job déclare uniquement ce dont il a besoin
permissions: {}

env:
  AWS_REGION: eu-west-3
  DEPLOYED_SHA_PARAM: /enervision/prod/deployed-sha
  INSTANCE_NAME: enervision-app

jobs:
  changes:
    name: Changed services
    # tant que l'infra n'est pas créée (variable absente), rien n'est construit ni déployé
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout du dépôt
      id-token: write       # OIDC AWS (lecture du dernier commit déployé)
    outputs:
      services: ${{ steps.select.outputs.services }}
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # tout l'historique, pour comparer avec la base
          persist-credentials: false

      - if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Base de comparaison
        id: base
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) base=$(aws ssm get-parameter --name "$DEPLOYED_SHA_PARAM" \
                    --query Parameter.Value --output text 2>/dev/null) || base= ;;
            *) base= ;;
          esac
          echo "sha=$base" >>"$GITHUB_OUTPUT"

      - name: Services modifiés
        id: select
        env:
          BASE: ${{ steps.base.outputs.sha }}
          ONLY: ${{ inputs.services }}
        run: python3 scripts/ci/changed-services.py --base "$BASE" --head "$GITHUB_SHA" --only "$ONLY"

  build:
    needs: changes
    if: needs.changes.outputs.builds != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout du dépôt
      id-token: write       # OIDC AWS (push ECR)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.builds) }}
    name: Image ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Tags de l'image
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          NAME: ${{ matrix.name }}
        run: |
          image=$REGISTRY/enervision/$NAME
          echo "tags=$image:$GITHUB_SHA,$image:latest" >>"$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false # sinon une attestation sans tag par image, comptée dans la rétention ECR
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Production
    needs: [changes, build]
    # build « skipped » quand seuls des services sans image (db) ont changé
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    # manual approval: the job waits for a required reviewer of the production environment
    # (Settings > Environments). The AWS role trusts its OIDC sub (…:environment:production).
    environment:
      name: production
      url: https://ener-vision.click
    permissions:
      contents: read        # checkout du dépôt (fichiers compose)
      id-token: write       # OIDC AWS
    # a newer run waiting for approval replaces an older pending one: approving it also
    # deploys the skipped changes, the diff starting from the last deployed commit
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publication des fichiers de la release
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: |
          dest=s3://$BUCKET/releases/$GITHUB_SHA
          for f in compose.yaml compose.prod.yaml; do aws s3 cp "$f" "$dest/$f"; done
          aws s3 cp --recursive infra "$dest/infra" --exclude 'terraform/*'

      # source de vérité : secrets GitHub ; deploy.sh les relit dans SSM pour construire le .env
      - name: Identifiants de l'API énergie
        env:
          ENERGY_API_USERNAME: ${{ secrets.ENERGY_API_USERNAME }}
          ENERGY_API_PASSWORD: ${{ secrets.ENERGY_API_PASSWORD }}
        run: |
          [[ -n "$ENERGY_API_USERNAME" && -n "$ENERGY_API_PASSWORD" ]] \
            || { echo "::error::secrets ENERGY_API_USERNAME / ENERGY_API_PASSWORD vides"; exit 1; }
          aws ssm put-parameter --name /enervision/prod/env/ENERGY_API_USERNAME --type SecureString \
            --value "$ENERGY_API_USERNAME" --overwrite >/dev/null
          aws ssm put-parameter --name /enervision/prod/env/ENERGY_API_PASSWORD --type SecureString \
            --value "$ENERGY_API_PASSWORD" --overwrite >/dev/null

      - name: Déploiement sur l'EC2 (SSM)
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          registry=$account.dkr.ecr.$AWS_REGION.amazonaws.com
          names=$(jq -r 'join(" ")' <<<"$SERVICES")

          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [[ "$instance" == i-* ]] || { echo "::error::instance $INSTANCE_NAME introuvable"; exit 1; }

          params=$(jq -nc \
            --arg region "$AWS_REGION" --arg bucket "$BUCKET" --arg sha "$GITHUB_SHA" \
            --arg registry "$registry" --arg names "$names" \
            '{executionTimeout: ["900"], commands: [
              "set -eu",
              "export AWS_REGION=\($region)",
              "aws s3 cp --recursive --quiet s3://\($bucket)/releases/\($sha)/ /opt/enervision/",
              "bash /opt/enervision/infra/deploy/deploy.sh \($sha) \($registry) \($names)"
            ]}')
          command=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment "deploy ${GITHUB_SHA::7}: $names" \
            --parameters "$params" --query Command.CommandId --output text)
          echo "commande SSM $command sur $instance : $names"

          for _ in $(seq 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query Status --output text 2>/dev/null) || continue
            [[ "$status" =~ ^(Pending|InProgress|Delayed)$ ]] || break
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [[ "$status" == Success ]] || { echo "::error::déploiement en échec ($status)"; exit 1; }

      - name: Mémorise le commit déployé
        run: |
          aws ssm put-parameter --name "$DEPLOYED_SHA_PARAM" --type String \
            --value "$GITHUB_SHA" --overwrite >/dev/null
