# Builds and deploys changed services (.github/services.json) after manual approval; manual runs choose services.
# Changes are computed from the last deployed SHA (SSM), so a failed run is caught up by the next one.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Services à déployer : all, ou noms séparés par des virgules (ex. web,db)"
        default: all

# no default permissions
permissions: {}

env:
  AWS_REGION: eu-west-3
  DEPLOYED_SHA_PARAM: /enervision/prod/deployed-sha
  INSTANCE_NAME: enervision-app
  MONITORING_INSTANCE_NAME: enervision-monitoring

jobs:
  changes:
    name: Changed services
    # nothing is built or deployed until the infrastructure exists
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      services: ${{ steps.select.outputs.services }}
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # full history, to compare with the base
          persist-credentials: false

      - if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Base de comparaison
        id: base
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) base=$(aws ssm get-parameter --name "$DEPLOYED_SHA_PARAM" \
                    --query Parameter.Value --output text 2>/dev/null) || base= ;;
            *) base= ;;
          esac
          echo "sha=$base" >>"$GITHUB_OUTPUT"

      - name: Services modifiés
        id: select
        env:
          BASE: ${{ steps.base.outputs.sha }}
          ONLY: ${{ inputs.services }}
        run: python3 scripts/ci/changed-services.py --base "$BASE" --head "$GITHUB_SHA" --only "$ONLY"

  build:
    needs: changes
    if: needs.changes.outputs.builds != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # OIDC AWS (push ECR)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.builds) }}
    name: Image ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Tags de l'image
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          NAME: ${{ matrix.name }}
        run: |
          image=$REGISTRY/enervision/$NAME
          echo "tags=$image:$GITHUB_SHA,$image:latest" >>"$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false # otherwise an untagged attestation per image counts towards ECR retention
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Production
    needs: [changes, build]
    # build is skipped when only image-less services (db) changed
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    # manual approval: the job waits for a required reviewer of the production environment
    # (Settings > Environments). The AWS role trusts its OIDC sub (…:environment:production).
    environment:
      name: production
      url: https://ener-vision.click
    permissions:
      contents: read
      id-token: write       # OIDC AWS
    # a newer pending run replaces an older one; its diff starts from the last deployed commit
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Récupération et publication des Parquet DVC
        id: datasets
        if: contains(fromJSON(needs.changes.outputs.services), 'prediction-service')
        run: |
          python3 services/ml-service/run_dvc.py pull
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --workdir /workspace \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --entrypoint python enervision-dvc:local \
            infra/deploy/dataset_release.py prepare --git-revision "$GITHUB_SHA" \
            --output .data/ml/dataset-release.json
          bash scripts/ml/upload-bootstrap.sh --release .data/ml/dataset-release.json
          uri=$(python3 infra/deploy/dataset_release.py verify \
            --release .data/ml/dataset-release.json --git-revision "$GITHUB_SHA")
          echo "uri=$uri" >>"$GITHUB_OUTPUT"

      - name: Publication des fichiers de la release
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          DATASET_URI: ${{ steps.datasets.outputs.uri }}
        run: |
          dest=s3://$BUCKET/releases/$GITHUB_SHA
          for f in compose.yaml compose.prod.yaml; do aws s3 cp "$f" "$dest/$f"; done
          aws s3 cp --recursive infra "$dest/infra" --exclude 'terraform/*'
          if [[ -n $DATASET_URI ]]; then
            aws s3 cp .data/ml/dataset-release.json "$dest/dataset-release.json"
          fi

      # source of truth: GitHub secrets; deploy.sh reads them back from SSM to build .env
      - name: Identifiants de l'API énergie
        env:
          ENERGY_API_USERNAME: ${{ secrets.ENERGY_API_USERNAME }}
          ENERGY_API_PASSWORD: ${{ secrets.ENERGY_API_PASSWORD }}
        run: |
          [[ -n "$ENERGY_API_USERNAME" && -n "$ENERGY_API_PASSWORD" ]] \
            || { echo "::error::secrets ENERGY_API_USERNAME / ENERGY_API_PASSWORD vides"; exit 1; }
          aws ssm put-parameter --name /enervision/prod/env/ENERGY_API_USERNAME --type SecureString \
            --value "$ENERGY_API_USERNAME" --overwrite >/dev/null
          aws ssm put-parameter --name /enervision/prod/env/ENERGY_API_PASSWORD --type SecureString \
            --value "$ENERGY_API_PASSWORD" --overwrite >/dev/null

      - name: Déploiement sur l'EC2 (SSM)
        timeout-minutes: 15
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          SERVICES: ${{ needs.changes.outputs.services }}
          DATASET_URI: ${{ steps.datasets.outputs.uri }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          registry=$account.dkr.ecr.$AWS_REGION.amazonaws.com

          # runs the SSM commands on the instance tagged $1 and waits for the result
          # usage: run_on <instance name> <names> <SSM parameters JSON>
          run_on() {
            local instance_name=$1 names=$2 params=$3 instance command status
            instance=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$instance_name" Name=instance-state-name,Values=running \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)
            [[ "$instance" == i-* ]] || { echo "::error::instance $instance_name introuvable"; exit 1; }

            command=$(aws ssm send-command --instance-ids "$instance" \
              --document-name AWS-RunShellScript --comment "deploy ${GITHUB_SHA::7}: $names" \
              --parameters "$params" --query Command.CommandId --output text)
            echo "commande SSM $command sur $instance : $names"

            for _ in $(seq 180); do
              sleep 5
              status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
                --query Status --output text 2>/dev/null) || continue
              [[ "$status" =~ ^(Pending|InProgress|Delayed)$ ]] || break
            done
            aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text
            [[ "$status" == Success ]] || { echo "::error::déploiement en échec ($status)"; exit 1; }
          }

          # every service runs on the app EC2, except monitoring (its own EC2)
          names=$(jq -r '[.[] | select(. != "monitoring")] | join(" ")' <<<"$SERVICES")
          if [[ -n "$names" ]]; then
            params=$(jq -nc \
              --arg region "$AWS_REGION" --arg bucket "$BUCKET" --arg sha "$GITHUB_SHA" \
              --arg registry "$registry" --arg names "$names" \
              '{executionTimeout: ["900"], commands: [
                "set -eu",
                "export AWS_REGION=\($region)",
                "aws s3 cp --recursive --quiet s3://\($bucket)/releases/\($sha)/ /opt/enervision/",
                "bash /opt/enervision/infra/deploy/deploy.sh \($sha) \($registry) \($names)"
              ]}')
            run_on "$INSTANCE_NAME" "$names" "$params"
            if [[ -n $DATASET_URI ]]; then
              # The EC2 validated and activated the release; SSM now records its URI.
              parameter=/enervision/prod/env/TRAINING_BOOTSTRAP_URI
              aws ssm put-parameter --name "$parameter" --type SecureString \
                --value "$DATASET_URI" --overwrite >/dev/null
              active=$(aws ssm get-parameter --name "$parameter" --with-decryption \
                --query Parameter.Value --output text)
              [[ $active == "$DATASET_URI" ]] || { echo "::error::URI SSM non confirmée"; exit 1; }
            fi
          fi

          if jq -e 'index("monitoring")' <<<"$SERVICES" >/dev/null; then
            # only the monitoring files are copied to the monitoring EC2
            params=$(jq -nc \
              --arg region "$AWS_REGION" --arg bucket "$BUCKET" --arg sha "$GITHUB_SHA" \
              '{executionTimeout: ["600"], commands: [
                "set -eu",
                "export AWS_REGION=\($region)",
                "aws s3 cp --recursive --quiet s3://\($bucket)/releases/\($sha)/infra/monitoring/ /opt/enervision/infra/monitoring/",
                "bash /opt/enervision/infra/monitoring/deploy.sh"
              ]}')
            run_on "$MONITORING_INSTANCE_NAME" monitoring "$params"
          fi

      - name: Mémorise le commit déployé
        run: |
          aws ssm put-parameter --name "$DEPLOYED_SHA_PARAM" --type String \
            --value "$GITHUB_SHA" --overwrite >/dev/null
