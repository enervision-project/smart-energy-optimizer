name: Prediction Service CI

on:
  workflow_call:
    secrets:
      SONAR_TOKEN_PREDICTION_SERVICE:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build, Sonar
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: services/prediction-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configuration Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: services/prediction-service/pyproject.toml

      - name: Cache des paquets SonarQube
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Installation dépendances
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: |
          python -m pytest --cov=src --cov-report=xml:coverage.xml --cov-report=term tests/

      - name: Build
        run: python -m build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        with:
          projectBaseDir: services/prediction-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PREDICTION_SERVICE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

