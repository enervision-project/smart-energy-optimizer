name: Verification code

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
      images: ${{ steps.images.outputs.builds || '[]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changed-services.py diffs against the PR base

      - name: Détection des modifications
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'app/**'
            # services.json also drives the ECR repositories created by Terraform
            terraform:
              - 'infra/terraform/**'
              - '.github/services.json'

      # same selection rules as the deployment (services.yml), against the PR base
      - name: Services with an image to build
        id: images
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/changed-services.py --base "$BASE" --head "$GITHUB_SHA"

  call-frontend:
    needs: changes
    # Exécute si 'app/' a changé OU si le workflow est lancé manuellement
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_ci-frontend.yml
    secrets:
      SONAR_TOKEN_FRONTEND: ${{ secrets.SONAR_TOKEN_FRONTEND }}

  call-terraform:
    needs: changes
    # runs when Terraform files changed, or on a manual run (like call-frontend)
    if: ${{ needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch' }}
    # a called workflow cannot get more permissions than its caller job
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_ci-terraform.yml

  # pull requests only: on main, services.yml builds, publishes and deploys the images
  call-images:
    needs: changes
    if: ${{ needs.changes.outputs.images != '[]' }}
    uses: ./.github/workflows/_ci-images.yml
    with:
      builds: ${{ needs.changes.outputs.images }}

  # Single check to require in the main ruleset: the call-* jobs only
  # exist when their paths changed.
  mr-ok:
    needs: [changes, call-frontend, call-terraform, call-images]
    # Uniquement sur les Pull Requests
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # skipped = paths unchanged; failure or cancelled blocks the merge
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"