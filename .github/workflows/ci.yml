name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# a new push on a pull request cancels its previous run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      core-api: ${{ steps.filter.outputs.core-api }}
      terraform: ${{ steps.filter.outputs.terraform }}
      images: ${{ steps.images.outputs.builds || '[]' }}
      etl-worker: ${{ steps.filter.outputs.etl-worker }}
      prediction-service: ${{ steps.filter.outputs.prediction-service }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # changed-services.py diffs against the PR base

      - name: Détection des modifications
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            frontend:
              - 'app/**'
              - '.github/workflows/_ci-frontend.yml'
            # the changelog defines the schema that Hibernate validates
            core-api:
              - 'services/core-api/**'
              - 'infra/db/changelog/**'
              - '.github/workflows/_ci-core-api.yml'
            # services.json also drives the ECR repositories created by Terraform
            terraform:
              - 'infra/terraform/**'
              - 'infra/backup/dump_db.py'
              - 'infra/backup/dump_host.py'
              - '.github/services.json'
            etl-worker:
              - 'services/etl-worker/**'
              - '.github/workflows/_ci-etl-worker.yml'
            prediction-service:
              - 'services/prediction-service/**'
              - 'services/ml-service/training/**'
              - 'services/ml-service/configs/hgb_production.yaml'
              - '.github/workflows/_ci-prediction-service.yml'
            infra:
                  - 'infra/**'
                  - '.github/workflows/**'
                  - '**/Dockerfile*'
                  - '**/compose*.yaml'
                  - '**/compose*.yml'
                  - 'sonar-project.properties'
                  - '.github/workflows/_ci-infra.yml'

      # same selection rules as the deployment (services.yml), against the PR base
      - name: Services with an image to build
        id: images
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/changed-services.py --base "$BASE" --head "$GITHUB_SHA"

  call-frontend:
    name: Frontend
    needs: changes
    # Exécute si 'app/' a changé OU si le workflow est lancé manuellement
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_ci-frontend.yml
    secrets:
      SONAR_TOKEN_FRONTEND: ${{ secrets.SONAR_TOKEN_FRONTEND }}

  call-core-api:
    name: Core API
    needs: changes
    # runs when core-api files changed, or on a manual run (like call-frontend)
    if: ${{ needs.changes.outputs.core-api == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_ci-core-api.yml
    secrets:
      SONAR_TOKEN_CORE_API: ${{ secrets.SONAR_TOKEN_CORE_API }}

  call-etl-worker:
    name: ETL Worker
    needs: changes
    # Exécute si 'services/etl-worker' a changé OU si le workflow est lancé manuellement
    if: ${{ needs.changes.outputs.etl-worker == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_ci-etl-worker.yml
    secrets:
      SONAR_TOKEN_ETL_WORKER: ${{ secrets.SONAR_TOKEN_ETL_WORKER }}

  call-prediction-service:
    name: Prediction Service
    needs: changes
    # Exécute si 'services/prediction-service' a changé OU si le workflow est lancé manuellement
    if: ${{ needs.changes.outputs.prediction-service == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_ci-prediction-service.yml
    secrets:
      SONAR_TOKEN_PREDICTION_SERVICE: ${{ secrets.SONAR_TOKEN_PREDICTION_SERVICE }}

  call-terraform:
    name: Terraform
    needs: changes
    # runs when Terraform files changed, or on a manual run (like call-frontend)
    if: ${{ needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch' }}
    # a called workflow cannot get more permissions than its caller job
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_ci-terraform.yml

  call-infra:
    name: Infra
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_ci-infra.yml
    secrets:
      SONAR_TOKEN_INFRA_ROOT: ${{ secrets.SONAR_TOKEN_INFRA_ROOT }}


  # pull requests only: on main, services.yml builds, publishes and deploys the images
  call-images:
    name: Docker images
    needs: changes
    if: ${{ needs.changes.outputs.images != '[]' }}
    uses: ./.github/workflows/_ci-images.yml
    with:
      builds: ${{ needs.changes.outputs.images }}

  # Single check to require in the main ruleset: the call-* jobs only
  # exist when their paths changed.
  mr-ok:
    needs: [changes, call-frontend, call-core-api, call-terraform, call-images, call-etl-worker, call-prediction-service, call-infra]
    # Uniquement sur les Pull Requests
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # skipped = paths unchanged; failure or cancelled blocks the merge
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"
