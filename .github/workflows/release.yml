# Publishes a release on each push to main, when the commits justify one.
name: Release

on:
  push:
    branches: [main]

# no default permissions
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # semantic-release needs the full history and tags
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --ignore-scripts --yes
          -p semantic-release@25.0.9
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
