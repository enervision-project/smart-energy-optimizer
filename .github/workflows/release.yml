# Publie une release (tag vX.Y.Z + notes GitHub) à chaque push sur main,
# si les commits depuis la dernière release le justifient.
name: Release

on:
  push:
    branches: [main]

# aucun droit par défaut, le job déclare uniquement ce dont il a besoin
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and release notes
    runs-on: ubuntu-26.04
    permissions:
      contents: write       # créer le tag et la release
      issues: write         # commenter les issues résolues
      pull-requests: write  # commenter les PR incluses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # semantic-release a besoin de tout l'historique et des tags
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
