name: Angular CI

on:
  workflow_call:
    secrets:
      SONAR_TOKEN_FRONTEND:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configuration Node JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #7.1
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/web/package-lock.json

      - name: Cache des paquets SonarQube
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --no-watch --coverage

      - name: Build
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: app/web
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

