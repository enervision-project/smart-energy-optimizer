name: Stack CI

# Ephemeral staging: starts the compose stack on the runner and checks it with scripts/ci/stack-smoke.sh.
# The ml profile is not started: it needs the historical Parquet files.

on:
  workflow_call:
    secrets:
      ENERGY_API_USERNAME:
        required: true
      ENERGY_API_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  stack:
    name: Démarrage et vérification de la stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Same contexts and cache as _ci-images.yml and services.yml; tags expected by compose.yaml.
      - name: Image core-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: services/core-api/Dockerfile
          load: true
          tags: enervision-core-api:latest
          cache-from: type=gha,scope=core-api

      - name: Image web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: app/web
          file: app/web/Dockerfile
          load: true
          tags: enervision-web:latest
          cache-from: type=gha,scope=web

      - name: Image etl-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: services/etl-worker/Dockerfile
          load: true
          tags: enervision-etl-worker:local
          cache-from: type=gha,scope=etl-worker

      - name: Configuration de test (.env)
        env:
          ENERGY_API_BASE_URL: ${{ vars.ENERGY_API_BASE_URL }}
          ENERGY_API_USERNAME: ${{ secrets.ENERGY_API_USERNAME }}
          ENERGY_API_PASSWORD: ${{ secrets.ENERGY_API_PASSWORD }}
        run: |
          # Disposable secrets; hexadecimal so they are safe in connection URLs.
          secret() { openssl rand -hex 16; }
          etl_password=$(secret)
          prediction_password=$(secret)
          {
            echo "POSTGRES_USER=enervision"
            echo "POSTGRES_PASSWORD=$(secret)"
            echo "POSTGRES_DB=enervision"
            # One account per service, created by db-bootstrap.
            echo "MIGRATOR_DB_PASSWORD=$(secret)"
            echo "CORE_API_DB_PASSWORD=$(secret)"
            echo "ETL_DB_PASSWORD=$etl_password"
            echo "PREDICTION_DB_PASSWORD=$prediction_password"
            echo "MONITORING_DB_PASSWORD=$(secret)"
            echo "ETL_DATABASE_URL=postgresql://etl_worker:$etl_password@db:5432/enervision"
            echo "PREDICTION_DATABASE_URL=postgresql://prediction_jobs:$prediction_password@db:5432/enervision"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "ADMIN_EMAIL=admin@enervision.ci"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "ENERGY_API_BASE_URL=$ENERGY_API_BASE_URL"
            echo "ENERGY_API_USERNAME=$ENERGY_API_USERNAME"
            echo "ENERGY_API_PASSWORD=$ENERGY_API_PASSWORD"
            echo "LOG_LEVEL=INFO"
          } >.env
          chmod 600 .env

      - name: Démarrage de la stack
        run: docker compose --env-file .env up -d --no-build db migrate core-api web scheduler

      - name: Vérifications
        run: bash scripts/ci/stack-smoke.sh

      - name: Logs de la stack
        if: ${{ always() }}
        run: |
          mkdir -p stack-logs
          if [ -f .env ]; then
            docker compose --env-file .env ps -a >stack-logs/ps.txt || true
            for service in db db-bootstrap migrate core-api web scheduler; do
              docker compose --env-file .env logs --no-color "$service" >"stack-logs/$service.log" 2>&1 || true
            done
          fi

      - name: Publication des logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stack-logs
          path: stack-logs/
          retention-days: 7

      - name: Arrêt de la stack
        if: ${{ always() }}
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env down -v
          fi
