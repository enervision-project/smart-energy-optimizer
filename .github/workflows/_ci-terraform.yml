name: Terraform CI

# Called by ci.yml when infra/terraform/ or .github/services.json changes.
# - validate: format and syntax, no AWS access needed.
# - plan: changes the apply would make, with a read-only AWS role.
#   Pull requests only (the role trusts pull_request OIDC tokens), and skipped
#   until the role exists (repository variable AWS_PLAN_ROLE_ARN, Terraform output).
#   Terraform variable without default: ENERGY_API_BASE_URL (repository variable).

on:
  workflow_call:

permissions: {}

env:
  TF_VERSION: 1.16.6
  # same values as infra/terraform/backend.hcl.example
  TF_STATE_BUCKET: enervision-tfstate-s3
  TF_STATE_KEY: prod/terraform.tfstate
  AWS_REGION: eu-west-3

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      # no backend and no AWS credentials: only downloads the providers from the lock file
      - name: Init
        run: terraform init -backend=false -input=false

      # main.tf reads ../../.github/services.json, hence the full checkout
      - name: Validate
        run: terraform validate -no-color

  plan:
    name: Plan
    needs: validate
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # OIDC AWS (read-only plan role)
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"

      # -lock=false: the role is read-only and cannot write the S3 lock file
      - name: Plan
        env:
          TF_VAR_energy_api_base_url: ${{ vars.ENERGY_API_BASE_URL }}
        run: |
          terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan \
            && status=0 || status=$?
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes
          [[ $status == 1 ]] && exit 1
          {
            echo "### Terraform plan"
            [[ $status == 0 ]] && echo "No changes." || echo "⚠️ The next \`terraform apply\` will change the infrastructure."
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*[-+~]|will be|must be|Plan:' | head -200
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
