name: Déployer la documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'services/etl-worker/docs/**'
      - 'mkdocs.yml'
      - 'services/etl-worker/mkdocs.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Installer les dépendances du projet depuis uv.lock / pyproject.toml
      - run: uv sync --frozen

      - run: uv run mkdocs gh-deploy --strict --force