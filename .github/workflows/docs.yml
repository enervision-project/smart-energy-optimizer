name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'services/etl-worker/docs/**'
      - 'services/etl-worker/mkdocs.yml'
      - 'services/ml-service/docs/**'
      - 'services/ml-service/mkdocs.yml'
      - 'services/prediction-service/docs/**'
      - 'services/prediction-service/mkdocs.yml'
      - 'services/core-api/docs/**'
      - 'services/core-api/mkdocs.yml'
      - 'app/web/docs/**'
      - 'app/web/mkdocs.yml'

permissions:
  contents: write

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'

      # Installer les dépendances du projet depuis uv.lock / pyproject.toml
      - run: uv sync --frozen

      - run: uv run mkdocs gh-deploy --strict --force