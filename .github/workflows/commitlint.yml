# Vérifie à la PR le format Conventional Commits (règles dans commitlint.config.mjs) :
# - chaque commit de la PR (déjà vérifiés en local par le hook .githooks/commit-msg) ;
# - le nom de la branche (feature/… ou fix/…, ou renovate/… pour les mises à jour de dépendances).
# Les PR sont fusionnées en rebase : ces commits arrivent tels quels sur main
# et c'est eux que semantic-release analyse ; le titre de la PR n'est pas utilisé.
# synchronize (nouveaux commits sur une PR ouverte) est nécessaire : un check
# obligatoire est lié au dernier commit de la PR, sans lui la PR resterait bloquée.
name: Conventions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# aucun droit par défaut, chaque job déclare uniquement ce dont il a besoin
permissions: {}

jobs:
  commits:
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout du dépôt
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # tout l'historique, pour comparer avec main
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: commitlint
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: >
          npx --yes
          -p @commitlint/cli@21.2.4
          -p @commitlint/config-conventional@21.2.4
          commitlint --from "$FROM" --to "$TO" --verbose

  branch-name:
    runs-on: ubuntu-24.04
    permissions: {}         # lit seulement le nom de branche de l'événement
    steps:
      - name: Nom de branche feature/…, fix/… ou renovate/…
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # renovate/ : branches créées par Renovate (préfixe par défaut)
          if [[ ! "$BRANCH" =~ ^(feature|fix|renovate)/[A-Za-z0-9._-]+ ]]; then
            echo "::error::Branche « $BRANCH » refusée : elle doit commencer par feature/, fix/ ou renovate/ (ex. feature/SEO-12-vue-parc)."
            exit 1
          fi
          echo "Branche « $BRANCH » valide."

