# Vérifie à la PR le format Conventional Commits (règles dans commitlint.config.mjs) :
# - chaque commit de la PR (déjà vérifiés en local par le hook .githooks/commit-msg) ;
# - le nom de la branche (feature/… ou fix/…) ;
# - le titre de la PR, qui devient le commit sur main en squash merge
#   et que semantic-release analyse pour calculer la version.
# synchronize (nouveaux commits sur une PR ouverte) est nécessaire : un check
# obligatoire est lié au dernier commit de la PR, sans lui la PR resterait bloquée.
name: Commits

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# aucun droit par défaut, chaque job déclare uniquement ce dont il a besoin
permissions: {}

jobs:
  commits:
    # rien à revérifier quand seul le titre ou la description de la PR change
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout du dépôt
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # tout l'historique, pour comparer avec main
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: commitlint
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: >
          npx --yes
          -p @commitlint/cli@21.2.4
          -p @commitlint/config-conventional@21.2.4
          commitlint --from "$FROM" --to "$TO" --verbose

  branch-name:
    runs-on: ubuntu-24.04
    permissions: {}         # lit seulement le nom de branche de l'événement
    steps:
      - name: Nom de branche feature/… ou fix/…
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|fix)/[A-Za-z0-9._-]+ ]]; then
            echo "::error::Branche « $BRANCH » refusée : elle doit commencer par feature/ ou fix/ (ex. feature/SEO-12-vue-parc)."
            exit 1
          fi
          echo "Branche « $BRANCH » valide."

  pr-title:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read   # lecture du titre de la PR
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
