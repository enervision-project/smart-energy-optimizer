# Checks the commits and branch name of each PR; PRs are rebased, so semantic-release reads these commits.
# synchronize is required: a mandatory check is bound to the PR's latest commit.
name: Conventions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# no default permissions
permissions: {}

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # full history, to compare with main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0

      - name: commitlint
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: >
          npx --ignore-scripts --yes
          -p @commitlint/cli@21.2.4
          -p @commitlint/config-conventional@21.2.4
          commitlint --from "$FROM" --to "$TO" --verbose

  branch-name:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}         # reads only the branch name from the event
    steps:
      - name: Nom de branche feature/…, fix/… ou renovate/…
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # renovate/: default Renovate prefix
          if [[ ! "$BRANCH" =~ ^(feature|fix|renovate)/[A-Za-z0-9._-]+ ]]; then
            echo "::error::Branche « $BRANCH » refusée : elle doit commencer par feature/, fix/ ou renovate/ (ex. feature/SEO-12-vue-parc)."
            exit 1
          fi
          echo "Branche « $BRANCH » valide."

