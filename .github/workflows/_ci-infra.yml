name: Infra CI

on:
  workflow_call:
    secrets:
      SONAR_TOKEN_INFRA_ROOT:
        required: true

permissions:
  contents: read

jobs:
  database-roles:
    name: TimescaleDB roles and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timescale: ['2.17.2-pg16', '2.30.2-pg16']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test fresh database, legacy upgrade and forbidden access
        env:
          TIMESCALE_TEST_IMAGE: timescale/timescaledb:${{ matrix.timescale }}
        run: python3 -m unittest discover -s infra/db/tests -v

  datasets:
    name: Dataset release tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test publication and deployment without AWS credentials
        run: python3 -B -m unittest discover -s scripts/ml/tests -v

  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install Python checks
        run: |
          python3 -m pip install --only-binary :all: --require-hashes -r infra/backup/requirements-dev.txt

      - name: Lint Python
        run: |
          ruff check infra/backup
          ruff format --check infra/backup
          ruff check infra/db/tests
          ruff format --check infra/db/tests
          ruff check services/ml-service/mlflow/init_db.py scripts/ml/tests/test_dataset_deploy.py
          ruff format --check services/ml-service/mlflow/init_db.py scripts/ml/tests/test_dataset_deploy.py

      - name: Tests and coverage (minimum 85 percent)
        run: |
          coverage run --rcfile=infra/backup/.coveragerc -m unittest discover -s infra/backup -p 'test_*.py' -v
          coverage report --rcfile=infra/backup/.coveragerc

      - name: Cache des paquets SonarQube
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_INFRA_ROOT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3
        with:
          dockerfile: '{Dockerfile,Dockerfile.training}'
          recursive: true

  actionlint:
    name: Lint .github
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --proto '=https' --proto-redir '=https' -sSLO "${BASE}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSLO "${BASE}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --ignore-missing --check "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Validate workflows
        run: actionlint -color

  dclint:
    name: Lint Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Run DCLint
        uses: docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17 # v1
        with:
          recursive: true



