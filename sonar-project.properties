sonar.projectKey=enervision-project_smart-energy-optimizer_infra_racine
sonar.organization=enervision-project

sonar.sources=.
sonar.tests=infra/backup
sonar.test.inclusions=infra/backup/test_*.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage-backup.xml

sonar.scanner.excludeHiddenFiles=false

sonar.inclusions=\
    infra/**,\
    .github/workflows/**,\
    **/Dockerfile*,\
    **/compose*.yaml,\
    **/compose*.yml,\
    **/docker-compose*.yaml,\
    **/docker-compose*.yml


sonar.coverage.exclusions=**/*


