sonar.projectKey=enervision-project_smart-energy-optimizer_infra_racine
sonar.organization=enervision-project

sonar.sources=.
sonar.tests=infra/backup,infra/db/tests
sonar.test.inclusions=infra/backup/test_*.py,infra/db/tests/test_*.py
sonar.python.version=3.12

sonar.scanner.excludeHiddenFiles=false

sonar.inclusions=\
    infra/**,\
    .github/workflows/**,\
    **/Dockerfile*,\
    **/compose*.yaml,\
    **/compose*.yml,\
    **/docker-compose*.yaml,\
    **/docker-compose*.yml


sonar.coverage.exclusions=**/*
sonar.qualitygate.wait=true


